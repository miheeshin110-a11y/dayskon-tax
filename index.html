function xlDate(v) {
  if (!v && v!==0) return "";
  if (v instanceof Date) return v.toISOString().slice(0,10);
  if (typeof v==="number") return new Date((v-25569)*86400000).toISOString().slice(0,10);
  return String(v).slice(0,10);
}
function fmtNum(n) { return n||n===0 ? Number(n).toLocaleString("ko-KR") : ""; }

function extractMonthLabel(filename) {
  const m = filename.match(/(\d{2})년(\d{2})월/) || filename.match(/(20\d{2})[-_](\d{2})/);
  if (!m) return null;
  return m[1].length===2 ? "20"+m[1]+"_"+m[2] : m[1]+"_"+m[2];
}

function autoMap(vendor, item, sheetRules) {
  const v=(vendor||"").trim(), i=(item||"").trim();
  for (const r of sheetRules) if (r.vendor===v&&r.item===i&&r.item!=="") return {account:r.account,source:"sheet"};
  if (BASE_ITEM_MAP[v+"||"+i]) return {account:BASE_ITEM_MAP[v+"||"+i],source:"exact"};
  for (const r of sheetRules) if (r.vendor===v&&r.item==="") return {account:r.account,source:"sheet"};
  if (BASE_VENDOR_MAP[v]) return {account:BASE_VENDOR_MAP[v],source:"vendor"};
  return {account:"보정예정",source:"new"};
}

function parseFile(raw, sheetRules) {
  const hdrIdx = raw.findIndex(r=>r.some(c=>String(c).includes("작성일자")));
  if (hdrIdx<0) return null;
  const hdrRow = raw[hdrIdx];
  const isHometax = hdrRow.length>=20||String(hdrRow[6]||"").trim()==="상호";
  return raw.slice(hdrIdx+1).filter(r=>r.some(c=>c!=="")).map((r,i)=>{
    const vendor=String(isHometax?r[6]:r[1]||"").trim();
    const item=String(isHometax?r[26]:r[5]||"").trim();
    const orig=isHometax?"":String(r[6]||"").trim();
    if (!vendor&&!item) return null;
    let mapped;
    if (orig&&orig!=="보정예정"){const m=autoMap(vendor,item,sheetRules);mapped=m.account!=="보정예정"?m:{account:orig,source:"exact"};}
    else mapped=autoMap(vendor,item,sheetRules);
    return {id:i,date:xlDate(r[0]),vendor,item,
      total:isHometax?r[14]:r[2],supply:isHometax?r[15]:r[3],tax:isHometax?r[16]:r[4],
      account:mapped.account,source:mapped.source,saved:false};
  }).filter(Boolean);
}

// 순수 GET 요청 — preflight 없음
async function getScript(url, params) {
  const qs = Object.entries(params).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
  const res = await fetch(url + "?" + qs);
  return await res.json();
}

// 행 데이터를 20개씩 청크로 나눠서 GET 전송
async function saveAllRows(url, monthLabel, rows) {
  const CHUNK = 20;
  let total = 0;
  for (let i=0; i<rows.length; i+=CHUNK) {
    const chunk = rows.slice(i, i+CHUNK);
    const result = await getScript(url, {
      action: "saveRows",
      monthLabel: monthLabel||"",
      rows: JSON.stringify(chunk)
    });
    if (!result.ok) throw new Error(result.error||"저장 실패");
    total += result.inserted||0;
  }
  return total;
}

function App() {
  const [rows,setRows]             = useState([]);
  const [meta,setMeta]             = useState(null);
  const [dragging,setDragging]     = useState(false);
  const [filter,setFilter]         = useState("all");
  const [scriptUrl,setScriptUrl]   = useState(()=>{try{return localStorage.getItem("das_url")||"";}catch{return "";}});
  const [syncStatus,setSyncStatus] = useState(null);
  const [syncMsg,setSyncMsg]       = useState("");
  const [showGuide,setShowGuide]   = useState(false);
  const [showCode,setShowCode]     = useState(false);
  const [copied,setCopied]         = useState(false);
  const [sheetRules,setSheetRules] = useState([]);
  const [rulesStatus,setRulesStatus] = useState(null);
  const fileRef = useRef();

  useEffect(()=>{try{if(scriptUrl)localStorage.setItem("das_url",scriptUrl);}catch{}},[scriptUrl]);

  useEffect(()=>{
    if (scriptUrl.startsWith("https://script.google.com")) {
      setRulesStatus("loading");
      getScript(scriptUrl,{action:"rules"})
        .then(data=>{ setSheetRules(data.rules||[]); setRulesStatus("ok"); })
        .catch(()=>setRulesStatus("error"));
    }
  },[scriptUrl]);

  async function loadRules() {
    if (!scriptUrl.startsWith("https://script.google.com")){alert("Apps Script URL을 입력하세요.");return;}
    setRulesStatus("loading");
    try {
      const data = await getScript(scriptUrl,{action:"rules"});
      const rules = data.rules||[];
      setSheetRules(rules);
      setRulesStatus("ok");
      if (rows.length>0) {
        setRows(prev=>prev.map(r=>{
          if (r.source==="manual"||r.saved) return r;
          const mapped=autoMap(r.vendor,r.item,rules);
          return {...r,account:mapped.account,source:mapped.source};
        }));
      }
    } catch { setRulesStatus("error"); }
  }

  function processFile(file) {
    const reader = new FileReader();
    reader.onload = e=>{
      const wb=XLSX.read(e.target.result,{type:"array"});
      const target=wb.SheetNames.find(n=>n.match(/\d+\.\d+월 세금계산서/)||(n.includes("세금계산서")&&!n.includes("최종")&&!n.includes("보정")))||wb.SheetNames[0];
      const raw=XLSX.utils.sheet_to_json(wb.Sheets[target],{header:1,defval:""});
      const parsed=parseFile(raw,sheetRules);
      if(!parsed){alert("헤더(작성일자)를 찾을 수 없습니다.");return;}
      let monthLabel=extractMonthLabel(file.name);
      if(!monthLabel&&parsed.length>0&&parsed[0].date){const d=parsed[0].date;monthLabel=d.slice(0,4)+"_"+d.slice(5,7);}
      setRows(parsed);
      setMeta({file:file.name,monthLabel,sheetName:"세금계산서_"+(monthLabel||"미확인"),
        total:parsed.length,
        exact:parsed.filter(r=>r.source==="exact"||r.source==="sheet").length,
        vendor:parsed.filter(r=>r.source==="vendor").length,
        newRow:parsed.filter(r=>r.source==="new").length});
      setSyncStatus(null);setSyncMsg("");
    };
    reader.readAsArrayBuffer(file);
  }

  function handleChange(account,id){
    setRows(prev=>prev.map(r=>r.id===id?{...r,account,source:"manual",saved:false}:r));
  }

  function handleSaveRule(id) {
    const r=rows.find(r=>r.id===id);
    if (!r||r.account==="보정예정") return;
    const newRule={vendor:r.vendor,item:r.item,account:r.account};
    setSheetRules(prev=>{
      const idx=prev.findIndex(x=>x.vendor===r.vendor&&x.item===r.item);
      if (idx>=0){const u=[...prev];u[idx]={...u[idx],account:r.account};return u;}
      return [...prev,newRule];
    });
    setRows(prev=>prev.map(row=>{
      if (row.id===id) return {...row,source:"sheet",saved:true};
      if (row.source!=="manual"&&row.vendor===r.vendor&&row.item===r.item)
        return {...row,account:r.account,source:"sheet"};
      return row;
    }));
  }

  async function handleSync() {
    if (!scriptUrl.startsWith("https://script.google.com")){alert("Apps Script URL을 입력하세요.");return;}
    setSyncStatus("loading");setSyncMsg("전송 중...");
    try {
      // 1. 행 데이터 저장 (20개씩 청크)
      const saveRows = rows.map(r=>({
        date:r.date,vendor:r.vendor,total:r.total,supply:r.supply,tax:r.tax,
        item:r.item,account:r.account,source:BADGE[r.source]?.label||"수동"
      }));
      const inserted = await saveAllRows(scriptUrl, meta?.monthLabel, saveRows);

      // 2. 신규 규칙 저장 (한 건씩)
      const newRules = rows.filter(r=>r.saved).map(r=>({vendor:r.vendor,item:r.item,account:r.account}));
      for (const rule of newRules) {
        await getScript(scriptUrl, {action:"saveRule", vendor:rule.vendor, item:rule.item, account:rule.account});
      }

      const ruleMsg = newRules.length>0 ? ` · 규칙 ${newRules.length}건 저장` : "";
      setSyncStatus("ok");
      setSyncMsg("✅ "+inserted+"행 → ["+meta?.sheetName+"]"+ruleMsg);
      setRows(prev=>prev.map(r=>({...r,saved:false})));
    } catch(err){
      setSyncStatus("error");setSyncMsg("❌ "+err.message);
    }
  }

  function exportExcel(){
    const hdrs=["작성일자","상호","합계금액","공급가액","세액","품목명","계정과목"];
    const wb2=XLSX.utils.book_new();
    const ws2=XLSX.utils.aoa_to_sheet([hdrs,...rows.map(r=>[r.date,r.vendor,r.total,r.supply,r.tax,r.item,r.account])]);
    ws2["!cols"]=[14,30,14,14,12,44,14].map(w=>({wch:w}));
    XLSX.utils.book_append_sheet(wb2,ws2,"세금계산서 최종");
    XLSX.writeFile(wb2,"세금계산서_최종_"+new Date().toISOString().slice(0,10)+".xlsx");
  }

  function copyScript(){
    try{
      const ta=document.createElement("textarea");ta.value=APPS_SCRIPT_CODE;
      ta.style.cssText="position:fixed;top:0;left:0;opacity:0;";
      document.body.appendChild(ta);ta.focus();ta.select();
      document.execCommand("copy");document.body.removeChild(ta);
      setCopied(true);setTimeout(()=>setCopied(false),2500);
    }catch{setShowCode(true);}
  }

  const displayed=rows.filter(r=>filter==="pending"?r.account==="보정예정":filter==="pangwanbi"?!NON_PANGWANBI.has(r.account)&&r.account!=="보정예정":true);
  const pendingCount=rows.filter(r=>r.account==="보정예정").length;
  const pangwanbiCount=rows.filter(r=>!NON_PANGWANBI.has(r.account)&&r.account!=="보정예정").length;
  const savedCount=rows.filter(r=>r.saved).length;

  const th={padding:"7px 8px",fontWeight:700,color:"#475569",fontSize:11,background:"#f8fafc",borderBottom:"2px solid #e2e8f0",whiteSpace:"nowrap",textAlign:"left"};
  const td={padding:"5px 8px",borderBottom:"1px solid #f1f5f9"};
  const btn=(bg,c,ex)=>({padding:"7px 14px",borderRadius:6,border:"none",background:bg,color:c||"#fff",cursor:"pointer",fontSize:12,fontWeight:700,...ex});

  return (
    <div style={{fontFamily:"'Apple SD Gothic Neo','Malgun Gothic',sans-serif",minHeight:"100vh",background:"#f1f5f9",color:"#1e293b"}}>
      <div style={{background:"#0f172a",padding:"11px 20px",display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:28,height:28,background:"#3b82f6",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,color:"#fff",fontSize:14}}>D</div>
        <div>
          <div style={{color:"#f8fafc",fontWeight:700,fontSize:14}}>세금계산서 계정과목 자동매핑</div>
          <div style={{color:"#64748b",fontSize:11}}>데이즈온 · 홈택스 원본 / 내부 정리본 · 월별 시트 분리 · 신규규칙 누적</div>
        </div>
      </div>

      <div style={{padding:"14px 20px",maxWidth:1100,margin:"0 auto"}}>

        <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:"10px 14px",marginBottom:12,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{fontSize:12,fontWeight:700,color:"#475569",whiteSpace:"nowrap"}}>📊 시트 URL</span>
          <input type="text" value={scriptUrl} onChange={e=>setScriptUrl(e.target.value)}
            placeholder="Apps Script 웹앱 URL (https://script.google.com/macros/s/...)"
            style={{flex:1,minWidth:200,border:"1px solid #e2e8f0",borderRadius:6,padding:"7px 10px",fontSize:12,outline:"none"}}
          />
          <button onClick={loadRules} disabled={rulesStatus==="loading"}
            style={{...btn("#6366f1"),opacity:rulesStatus==="loading"?0.6:1,whiteSpace:"nowrap",padding:"7px 14px"}}>
            {rulesStatus==="loading"?"로딩...":rulesStatus==="ok"?"✅ 규칙 "+sheetRules.length+"건 로드됨":"🔄 규칙 불러오기"}
          </button>
          <button onClick={()=>setShowGuide(g=>!g)}
            style={{background:"none",border:"1px solid #e2e8f0",borderRadius:6,padding:"7px 12px",fontSize:12,cursor:"pointer",color:"#64748b",whiteSpace:"nowrap"}}>
            {showGuide?"▲":"⚙ 설정 안내"}
          </button>
        </div>

        {showGuide && (
          <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:10,padding:"14px",marginBottom:12,fontSize:12,lineHeight:1.9,color:"#334155"}}>
            <b>⚙ Apps Script 설정</b>
            <ol style={{margin:"8px 0 0 18px",padding:0,lineHeight:2.2}}>
              <li>구글 시트 → 확장 프로그램 → Apps Script</li>
              <li>편집기 코드 전체 삭제 후 아래 코드 붙여넣기</li>
              <li>Ctrl+S 저장 → 배포 → 배포 관리 → 연필 → 새 버전 → 배포</li>
              <li>웹앱 URL을 위 입력란에 붙여넣기</li>
            </ol>
            <div style={{marginTop:10,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span style={{fontWeight:700}}>Apps Script 코드</span>
              <button onClick={copyScript} style={{background:copied?"#dcfce7":"#3b82f6",border:"none",borderRadius:6,padding:"6px 16px",fontSize:12,cursor:"pointer",fontWeight:700,color:copied?"#166534":"#fff"}}>
                {copied?"✅ 복사됨!":"📋 코드 복사"}
              </button>
              <button onClick={()=>setShowCode(v=>!v)} style={{background:"none",border:"1px solid #e2e8f0",borderRadius:6,padding:"6px 12px",fontSize:12,cursor:"pointer",color:"#475569"}}>
                {showCode?"접기":"직접 보기"}
              </button>
            </div>
            {showCode && (
              <textarea readOnly value={APPS_SCRIPT_CODE} onClick={e=>e.target.select()}
                style={{marginTop:8,width:"100%",height:180,fontSize:11,fontFamily:"monospace",border:"1px solid #e2e8f0",borderRadius:6,padding:"10px",background:"#0f172a",color:"#e2e8f0",resize:"vertical"}}
              />
            )}
          </div>
        )}

        <div onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)}
          onDrop={e=>{e.preventDefault();setDragging(false);const f=e.dataTransfer.files[0];if(f)processFile(f);}}
          onClick={()=>fileRef.current.click()}
          style={{border:"2px dashed "+(dragging?"#3b82f6":"#cbd5e1"),borderRadius:10,padding:"28px 16px",textAlign:"center",cursor:"pointer",background:dragging?"#eff6ff":"#fff",marginBottom:12}}>
          <div style={{fontSize:30,marginBottom:6}}>📂</div>
          <div style={{fontWeight:700,fontSize:14,marginBottom:3}}>세금계산서 파일 드래그 또는 클릭</div>
          <div style={{color:"#94a3b8",fontSize:12}}>홈택스 .xls 원본 · 내부 판관비목록 .xlsx 모두 지원</div>
          <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={e=>{if(e.target.files[0])processFile(e.target.files[0]);}}/>
        </div>

        {meta && (
          <div style={{marginBottom:12}}>
            <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"9px 14px",marginBottom:10,fontSize:12,color:"#1e40af",display:"flex",alignItems:"center",gap:8}}>
              <span>📋</span><span>업데이트 대상 시트: <b>{meta.sheetName}</b></span>
              <span style={{color:"#93c5fd",fontSize:11}}>— 없으면 자동 생성</span>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
              {[
                {k:"all",label:"전체",val:meta.total,bg:"#f1f5f9",color:"#334155"},
                {k:"all",label:"자동매핑",val:rows.filter(r=>r.source==="exact"||r.source==="sheet").length,bg:"#dcfce7",color:"#166534"},
                {k:"all",label:"상호",val:rows.filter(r=>r.source==="vendor").length,bg:"#dbeafe",color:"#1e40af"},
                {k:"pending",label:"⚠ 보정필요",val:pendingCount,bg:"#fef3c7",color:"#92400e"},
                {k:"pangwanbi",label:"판관비",val:pangwanbiCount,bg:"#f0fdf4",color:"#15803d"},
              ].map(s=>(
                <div key={s.label} onClick={()=>setFilter(f=>f===s.k&&s.k!=="all"?"all":s.k)}
                  style={{background:s.bg,borderRadius:8,padding:"8px 14px",cursor:s.k!=="all"?"pointer":"default",border:filter===s.k&&s.k!=="all"?"2px solid "+s.color:"2px solid transparent"}}>
                  <div style={{fontSize:11,color:s.color,fontWeight:600,marginBottom:2}}>{s.label}</div>
                  <div style={{fontSize:20,fontWeight:800,color:s.color}}>{s.val}</div>
                </div>
              ))}
            </div>
            {pendingCount>0 && (
              <div style={{background:"#fffbeb",border:"1px solid #fcd34d",borderRadius:8,padding:"9px 14px",marginBottom:10,fontSize:12,color:"#92400e"}}>
                💡 계정과목 선택 → <b>규칙저장</b> 클릭 시 즉시 반영 · 📤 업데이트 시 시트에 영구 저장
              </div>
            )}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:8}}>
              <div style={{fontSize:12,color:"#64748b",display:"flex",alignItems:"center",gap:8}}>
                <span>📄 {meta.file}</span>
                {savedCount>0 && <span style={{background:"#fdf4ff",color:"#7e22ce",borderRadius:5,padding:"2px 10px",fontWeight:600}}>규칙 {savedCount}건 저장 예정</span>}
              </div>
              <div style={{display:"flex",gap:6}}>
                <button style={{...btn("#fff","#475569",{border:"1px solid #e2e8f0"})}} onClick={()=>{setRows([]);setMeta(null);setFilter("all");setSyncStatus(null);}}>다시 업로드</button>
                <button style={btn("#0f172a")} onClick={exportExcel}>⬇ Excel</button>
                <button onClick={handleSync} disabled={syncStatus==="loading"} style={{...btn("#16a34a"),opacity:syncStatus==="loading"?0.6:1}}>
                  {syncStatus==="loading"?"전송 중...":"📤 구글 시트 업데이트"}
                </button>
              </div>
            </div>
            {syncMsg && <div style={{marginBottom:8,fontSize:13,fontWeight:600,color:syncStatus==="ok"?"#166534":"#dc2626"}}>{syncMsg}</div>}
          </div>
        )}

        {displayed.length>0 && (
          <div style={{background:"#fff",borderRadius:8,border:"1px solid #e2e8f0",overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:700}}>
              <thead>
                <tr>
                  <th style={{...th,width:90}}>작성일자</th>
                  <th style={{...th,minWidth:120}}>상호</th>
                  <th style={{...th,width:100,textAlign:"right"}}>합계금액</th>
                  <th style={{...th,minWidth:140}}>품목명</th>
                  <th style={{...th,width:120}}>계정과목</th>
                  <th style={{...th,width:68}}>출처</th>
                  <th style={{...th,width:80,textAlign:"center"}}>규칙저장</th>
                </tr>
              </thead>
              <tbody>
                {displayed.map((r,i)=>{
                  const badge=BADGE[r.source]||BADGE.manual;
                  const dim=NON_PANGWANBI.has(r.account);
                  const canSave=(r.source==="new"||r.source==="manual"||r.source==="sheet")&&r.account!=="보정예정"&&!r.saved;
                  return (
                    <tr key={r.id} style={{background:i%2===0?"#fff":"#f8fafc",opacity:dim?0.4:1}}>
                      <td style={{...td,color:"#94a3b8",fontSize:11,whiteSpace:"nowrap"}}>{r.date}</td>
                      <td style={{...td,maxWidth:150,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:500}} title={r.vendor}>{r.vendor}</td>
                      <td style={{...td,textAlign:"right",whiteSpace:"nowrap",fontVariantNumeric:"tabular-nums"}}>{fmtNum(r.total)}</td>
                      <td style={{...td,maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"#475569",fontSize:11}} title={r.item}>{r.item}</td>
                      <td style={{...td,padding:"3px 8px"}}>
                        <select value={r.account} onChange={e=>handleChange(e.target.value,r.id)}
                          style={{border:"1.5px solid "+(r.account==="보정예정"?"#fbbf24":"#e2e8f0"),borderRadius:5,padding:"4px 6px",fontSize:11,
                            background:r.account==="보정예정"?"#fffbeb":"#f8fafc",
                            fontWeight:r.account==="보정예정"?700:400,
                            color:r.account==="보정예정"?"#92400e":"#1e293b",
                            cursor:"pointer",outline:"none",width:"100%"}}>
                          {ALL_ACCOUNTS.map(a=><option key={a} value={a}>{a}</option>)}
                        </select>
                      </td>
                      <td style={{...td,padding:"3px 8px"}}>
                        <span style={{background:badge.bg,color:badge.color,borderRadius:4,padding:"2px 6px",fontSize:10,fontWeight:600,whiteSpace:"nowrap"}}>{badge.label}</span>
                      </td>
                      <td style={{...td,textAlign:"center",padding:"3px 8px"}}>
                        {r.saved?(
                          <span style={{fontSize:11,color:"#7e22ce",fontWeight:600}}>✓ 적용됨</span>
                        ):canSave?(
                          <button onClick={()=>handleSaveRule(r.id)}
                            style={{border:"1px solid #7e22ce",borderRadius:5,padding:"3px 10px",fontSize:11,cursor:"pointer",fontWeight:600,background:"#fdf4ff",color:"#7e22ce",whiteSpace:"nowrap"}}>
                            {r.source==="sheet"?"수정저장":"규칙저장"}
                          </button>
                        ):null}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
